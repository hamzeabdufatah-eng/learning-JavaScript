<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #112827;
      }
      .calculator-container {
        background: #ffffff;
        padding: 40px 25px;
        max-width: 450px;
        width: 100%;
        border-radius: 12px;
        box-shadow: o 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin-bottom: 30px;
        text-align: center;
        font-size: 28px;
        color: #111827;
      }
      #display {
        width: 100%;
        height: 65px;
        margin-bottom: 20px;
        text-align: right;
        font-size: 30px;
        border: 2px solid #e5e7eb;
        padding: 10px;
        border-radius: 8px;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      button {
        height: 60px;
        border: none;
        background: #e5e7eb;
        border-radius: 8px;
        font-size: 22px;
        transition: 0.2s ease;
      }
      button:hover {
        opacity: 0.75;
        transform: scale(0.96);
      }
      .operator {
        background: #2563eb;
        color: white;
      }
      #clear {
        background: #dc2626;
        color: white;
      }
      #equals {
        background: #16ac4a;
        grid-row: span 2;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="calculator-container">
      <h1>Calculator</h1>
      <input type="text" id="display" value="0" readonly />
      <div class="buttons">
        <button id="clear">C</button>
        <button class="operator" data-operator="/">/</button>
        <button class="operator" data-operator="x">x</button>
        <button class="operator" data-operator="-">-</button>
        <button class="number" data-number="7">7</button>
        <button class="number" data-number="8">8</button>
        <button class="number" data-number="9">9</button>
        <button class="operator" data-operator="+">+</button>
        <button class="number" data-number="4">4</button>
        <button class="number" data-number="5">5</button>
        <button class="number" data-number="6">6</button>
        <button id="equals">>=</button>
        <button class="number" data-number="1">1</button>
        <button class="number" data-number="2">2</button>
        <button class="number" data-number="0">0</button>
      </div>
    </div>
    <script>
      const display = document.getElementById("display");
      const clear = document.getElementById("clear");
      const equals = document.getElementById("equals");
      const operatorDisplay = document.querySelectorAll(".operator");
      const numberDisplay = document.querySelectorAll(".number");
      let currentInput = "0";
      let shouldResetInput = false;
      let reult = 0;
      let operator = null;
      let previousInput = null;
      function updateDisplay() {
        display.value = currentInput;
      }
      function inputNumber(number) {
        if (currentInput === "0" || shouldResetInput) {
          currentInput = number;
          shouldResetInput = false;
        } else {
          currentInput += number;
        }
        updateDisplay();
      }
      numberDisplay.forEach(function (button) {
        button.addEventListener("click", function () {
          inputNumber(button.dataset.number);
        });
      });
      function chooseOperator(nextOperator) {
        previousInput = currentInput;
        operator = nextOperator;
        shouldResetInput = true;
      }
      operatorDisplay.forEach(function (button) {
        button.addEventListener("click", function () {
          chooseOperator(button.dataset.operator);
        });
      });
      function calculate() {
        const firstInput = Number(previousInput);
        const secondInput = Number(currentInput);
        let result;
        if (operator === "+") {
          result = firstInput + secondInput;
        } else if (operator === "-") {
          result = firstInput - secondInput;
        } else if (operator === "x") {
          result = firstInput * secondInput;
        } else if (operator === "/") {
          if (secondInput === 0) {
            currentInput = "Error";
            updateDisplay();
            return;
          }
          result = firstInput / secondInput;
        }
        currentInput = String(result);
        previousInput = null;
        operator = null;
        shouldResetInput = true;
        updateDisplay();
      }
      equals.addEventListener("click", calculate);
    </script>
  </body>
</html>
