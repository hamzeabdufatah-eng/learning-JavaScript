<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade calculator</title>
    <style>
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        align-items: center;
      }
      div {
        padding: 10px 20px;
        margin: 0 auto;
        background-color: bisque;
        width: 300px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
      }
      input {
        padding: 10px;
        border-radius: 5px;
        border: none;
      }
      button {
        padding: 6px;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>grade calculator</h1>
      <input id="studentName" type="text" placeholder="enter your name" />
      <br /><br />
      <input id="score" placeholder="enter your score 0-100" />
      <br /><br />
      <button id="btnEnter">calculatBtn</button>
      <br /><br />
      <h2 id="result"></h2>
      <br /><br />
      <button id="btnReset">reset</button>
    </div>
    <script>
      const studentName = document.getElementById("studentName");
      const score = document.getElementById("score");
      const calculate = document.getElementById("btnEnter");
      const result = document.getElementById("result");
      const btnReset = document.getElementById("btnReset");
      calculate.addEventListener("click", function () {
        const name = studentName.value.trim();
        const scoreText=score.value.trim()
       const marks = Number(scoreText);
        if (name=== "" ) {
          result.textContent = "enter student name";
        return;
        }
        if(scoreText===""){
            result.textContent="please inter a student score"
            return;
        }
        if (isNaN(marks)){
            result.textContent="please enter a valid number"
            return;
        }
        if ( marks< 0 || marks > 100) {
          result.textContent = "score must be between 0 and 100";
          return;
        }
        let grade = "";
        let message = "";
        if (marks >= 90) {
          grade = "A";
          message = "Excellent";
        } else if (marks >= 80) {
          grade = "B";
          message = "Very Good";
        } else if (marks > 70) {
          grade = "C";
          message = "Good";
        } else if (marks >= 60) {
          grade = "D";
          message = "Needs Improvement";
        } else {
          grade = "F";
          message = "Failed";
        }
        result.textContent = `student:${name}
        grade:${grade} ${message}`;
        studentName.value = "";
        score.value = "";
        // result.textContent = "";
      });
      btnReset.addEventListener("click", () => {
        studentName.value = "";
        score.value = "";
        result.textContent = "";
      });
    </script>
  </body>
</html>
