<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background: #1e1a2e;
      }
      .clock-container {
        background: #16213e;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 100%;
        text-align: center;
        max-width: 450px;
      }
      .time {
        font-size: 4.5rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 15px;
      }
      .time-ampm {
        font-size: 1.2rem;
        color: gray;
      }
      .date {
        font-size: 1.2rem;
        color: gray;
      }
      span {
        font-size: 50px;
      }
    </style>
  </head>
  <body>
    <div class="clock-container">
      <span> ⏱️ </span>
      <div class="time">
        <span class="hours-minutes"></span>
        <span class="time-ampm"></span>
      </div>
      <div class="date"></div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
