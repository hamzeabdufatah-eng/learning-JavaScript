<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Grid Example</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }
      .main {
        width: 100%;
        max-width: 1000px;
        margin: 15px auto;
        background: #e6f9ec;
        padding: 20px;
        border-radius: 4px;
        border: 1px solid #000;
      }
      h1 {
        text-align: center;
      }
      .container {
        display: grid;
        grid-template-columns: 15% 1fr 1fr;
        grid-template-areas:
          "header header header"
          "sidebar content1 content1"
          "sidebar content2 content3"
          "footer footer footer";
        gap: 20px;
      }
      .container > div {
        min-width: 0;
        background: #00ff00;
        border: 2px solid #143c14;
        border-radius: 2px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 500;
        font-size: 22px;
      }
      .header {
        grid-area: header;
        min-height: 110px;
      }
      .sidebar {
        grid-area: sidebar;
        min-height: 100px;
      }
      .content1 {
        grid-area: content1;
        min-height: 160px;
      }
      .content2 {
        grid-area: content2;
        min-height: 160px;
      }
      .content3 {
        grid-area: content3;
        min-height: 160px;
      }
      .footer {
        grid-area: footer;
        min-height: 160px;
      }
      @media (max-width: 768px) {
        .main {
          padding: 15px;
        }
        .container {
          grid-template-columns: 1fr 1fr;
          grid-template-areas:
            "header header"
            "sidebar sidebar"
            "content1 content1"
            "content2 content3"
            "footer footer";
        }
      }
      @media (max-width: 500px) {
        .main {
          padding: 10px;
          margin: 5px auto;
        }
        h1 {
          font-size: 26px;
        }
        .container {
          grid-template-columns: 1fr;
          grid-template-areas:
            "header"
            "sidebar"
            "content1"
            "content2"
            "content3"
            "footer";
        }
        .container > div {
          font-size: 20px;
        }
        .header {
          min-height: 90px;
        }
        .content1,
        .content2,
        .content3 {
          min-height: 130px;
        }
        .footer {
          min-height: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1>Css Grid</h1>
      <div class="container">
        <div class="header">header</div>
        <div class="sidebar">sidebar</div>
        <div class="content1">Content1</div>
        <div class="content2">Content2</div>
        <div class="content3">Content3</div>
        <div class="footer">Footer</div>
      </div>
    </div>
    <script></script>
  </body>
</html>
