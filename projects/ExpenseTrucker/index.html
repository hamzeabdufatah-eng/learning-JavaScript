<!doctype html>
<html lang="en">
  <head>
    <link rel="shortcut icon" href="#" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Trucker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expence Tracker</h1>
      <div id="summary">
        <div class="card-balance">
          <h3>Total Income</h3>
          <p>$5000</p>
        </div>
        <div class="card-expense">
          <h3>Total Expenses</h3>
          <p>$3000</p>
        </div>
        <div class="card-income">
          <h3>Net Seving</h3>
          <p>$2000</p>
        </div>
      </div>
      <div class="transection-form">
        <h2>Add Transection</h2>
        <form novalidate>
          <input type="hidden" id="transection-id" />
          <div class="form-group">
            <label for="transection-type">Type</label>
            <select id="transection-type">
              <option value="income">income</option>
              <option value="expense">expense</option>
            </select>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              placeholder="Enter description"
              required
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" placeholder="amount" required />
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required></select>
            </div>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-button">Cancel</button>
            <button type="submit" id="add-transection">Add Transection</button>
          </div>
        </form>

        <div class="transections">
          <h2>Transections</h2>
          <div class="form-group">
            <input type="text" id="search" placeholder="Search transections" />
          </div>
          <table id="transection-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>type</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="transection-list"></tbody>
          </table>
        </div>
        <div class="no-transection">
          <p>No Transection Found.</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
